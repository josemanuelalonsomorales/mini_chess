<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Chess</title>
  <link rel="icon" type="image/png" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 class="game-title">Mini Chess 5x5</h1>

  <div class="box-container">
    <section class="player-info">
      <span class="username" id="blackPlayerName">JUGADOR_NEGRAS</span>
      <span style="color: var(--text-muted); font-size: 0.9rem;">(Negras)</span>
    </section>
  </div>

  <div class="board-5x5" id="chessBoard"></div>

  <div class="box-container">
    <section class="player-info">
      <span class="username" id="whitePlayerName">JUGADOR_BLANCAS</span>
      <span style="color: var(--text-muted); font-size: 0.9rem;">(Blancas)</span>
    </section>
  </div>

  <div class="banner-alert" id="gameAlert">
    Turno de Blancas
  </div>

  <footer style="display: flex; gap: 10px; margin-top: 10px; flex-direction: column; align-items: center;">
    <button class="btn-action" onclick="reiniciarPartida()">Reiniciar Partida</button>
    <small id="instanceTracker" style="color: gray; font-size: 0.75rem; margin-top: 5px;">
      Instancia Activa: Evaluando...
    </small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
