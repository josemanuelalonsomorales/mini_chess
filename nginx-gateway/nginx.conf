
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # El API Gateway es el único backend HTTP de Nginx.
    # El balanceo entre los servicios gRPC se realiza dentro del Gateway.
    upstream backend_pool {
        server api-gateway:8001;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name localhost;

        # Limita el tamaño de las solicitudes al mismo límite del Gateway.
        client_max_body_size 1m;

        # Cabeceras de seguridad básicas.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # El heartbeat se consulta realmente al API Gateway.
        location = /heartbeat {
            proxy_pass http://backend_pool/heartbeat;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_next_upstream off;
            proxy_redirect off;
        }

        # API HTTP: conserva la ruta original al reenviarla al Gateway.
        location ^~ /api/ {
            proxy_pass http://backend_pool;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Evita reintentar automáticamente solicitudes de escritura.
            proxy_next_upstream off;

            # Conserva las respuestas originales del API Gateway.
            proxy_intercept_errors off;
            proxy_redirect off;
        }

        # Frontend estático.
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
