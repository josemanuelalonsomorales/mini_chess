syntax = "proto3";

package pb;

option go_package = "proto/pb";

// --- USERS SERVICE ---
message User {
  int32 id = 1;
  string username = 2;
  int32 rating = 3;
}

message GetUserRequest {
  int32 user_id = 1;
}

// --- MATCHMAKING SERVICE ---
message MatchRequest {
  int32 player_id = 1;
}

message MatchResponse {
  string game_id = 1;
  int32 white_player_id = 2;
  int32 black_player_id = 3;
  string status = 4;
}

// --- GAME LOGIC SERVICE ---
message Piece {
  int32 id = 1;
  string jugador = 2;   // "WHITE" | "BLACK"
  string tipo = 3;      // "KING", "PAWN", etc.
  string pos_x = 4;     // "A" - "E"
  int32 pos_y = 5;      // 1 - 5
  bool esta_viva = 6;
}

message GameState {
  int32 id = 1;
  string turno_actual = 2; // "WHITE" | "BLACK"
  string estado = 3;       // "IN_PROGRESS", "WHITE_WON", "BLACK_WON", "DRAW"
  repeated Piece piezas = 4;
  string instance_id = 5;  // Para identificar la instancia del backend
}

message GetGameRequest {
  int32 game_id = 1;
}

message MoveRequest {
  int32 game_id = 1;
  int32 id_pieza = 2;
  string destino_x = 3;
  int32 destino_y = 4;
}

message Empty {}

// --- SERVICIOS gRPC ---
service UserService {
  rpc GetUser (GetUserRequest) returns (User);
}

service MatchmakingService {
  rpc FindMatch (MatchRequest) returns (MatchResponse);
}

service GameService {
  rpc GetGameState (GetGameRequest) returns (GameState);
  rpc MakeMove (MoveRequest) returns (GameState);
  rpc ResetGame (GetGameRequest) returns (GameState);
}