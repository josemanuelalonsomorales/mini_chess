version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mini_chess_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: minichess
    ports:
      - "5432:5432"
    volumes:
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/02_init_data.sql:/docker-entrypoint-initdb.d/02_init_data.sql

  game-service-1:
    build:
      context: .
      dockerfile: ./services/game-service/Dockerfile
    container_name: game_service_1
    environment:
      - PORT=50053
      - INSTANCE_ID=game-service-node-01
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=minichess
    depends_on:
      - db

  game-service-2:
    build:
      context: .
      dockerfile: ./services/game-service/Dockerfile
    container_name: game_service_2
    environment:
      - PORT=50053
      - INSTANCE_ID=game-service-node-02
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=minichess
    depends_on:
      - db

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: api_gateway
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - GAME_BACKENDS=game-service-1:50053,game-service-2:50053
    depends_on:
      - game-service-1
      - game-service-2

  nginx-gateway:
      build:
        context: .
        dockerfile: ./nginx-gateway/Dockerfile
      container_name: nginx_gateway
      ports:
        - "8000:8000"
      depends_on:
        - api-gateway
